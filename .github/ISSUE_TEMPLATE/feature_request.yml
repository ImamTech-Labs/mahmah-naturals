name: Feature request
description: Suggest a practical improvement to MahMah Naturals
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain the customer, shop-owner, or contributor need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Customer storefront
        - Product catalogue
        - Shopping bag
        - Order management
        - Owner dashboard
        - Accessibility
        - Documentation
        - Developer experience
        - Other
    validations:
      required: true

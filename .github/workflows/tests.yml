name: Test MahMah Naturals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check cart-storage.js
          node --check payment-return.js

      - name: Run shopping bag tests
        run: node --test tests/cart-storage.test.js

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile server.py build_static.py

      - name: Run checkout validation tests
        run: python -m unittest discover -s tests -v

      - name: Build the static storefront
        run: python build_static.py

      - name: Verify public build output
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/cart-storage.js
          test -f dist/admin.html
          test -f dist/admin.js
          test -f dist/supabase-config.js
          test -d dist/assets
          test ! -e dist/server.py
          test ! -e dist/.env
          test ! -e dist/orders.sqlite3

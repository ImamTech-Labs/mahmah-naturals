name: Test MahMah Naturals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run checkout validation tests
        run: python -m unittest discover -s tests -v

      - name: Build the static storefront
        run: python build_static.py

      - name: Verify public build output
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -d dist/assets
          test ! -e dist/server.py
          test ! -e dist/.env
